[package]
name = "lepton-servo"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Lepton's Servo bridge: Servo behind the C ABI in zig/servo/lepton_servo.h. Built in CI, never on the project's machine."

# Not a member of the repository's workspace: Servo's dependency tree (about 750
# crates) must never reach `cargo build` or `cargo test` at the root.
[workspace]

[lib]
name = "lepton_servo"
# cdylib for the core to link; rlib so the layout tests run with `cargo test`.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Servo's LTS line, pinned exactly: monthly releases break the embedding API. Its default
# features leave out WebGL and give media a dummy backend that plays nothing (measured on the
# 0.1.9-beta.2 library: no GStreamer in NEEDED, no `WebGL2RenderingContext`), so a WebGL page
# drew nothing and `<audio>` and Web Audio were silent. `media-gstreamer` is Servo's
# GStreamer backend; the runner installs its -dev packages (Servo book list, servo-bridge.yml).
servo = { version = "=0.6.0", features = ["webgl", "media-gstreamer"] }
# Its library is named `net_traits`: the request body's stream types, which `servo`
# does not re-export.
servo-net-traits = "=0.6.0"
# Patched (`[patch.crates-io]` below): the app's scheme gets a tuple origin.
servo-url = "=0.6.0"
ipc-channel = "0.22"
dpi = "0.1"
euclid = "0.22"
http = "1.4"
keyboard-types = "0.8"
# The body stream is shared behind `parking_lot::Mutex` (`RequestBody::clone_stream`).
parking_lot = "0.12"
raw-window-handle = "0.6"
tokio = { version = "1", features = ["sync"] }
url = "2.5"

# Servo gives a custom scheme's pages an opaque origin, and an opaque origin has no
# `localStorage` (measured: `SecurityError`). This copy of servo-url 0.6.0 adds
# `register_tuple_origin_scheme`, which the bridge calls for the app's scheme, so its
# pages have a (scheme, host) origin as on WPE WebKit and WebView2. The change is marked
# `Lepton:` in `origin.rs` and `lib.rs`; carry it over when Servo is upgraded.
#
# `servo/patches/servo` is servo 0.6.0 with `SiteDataManager::write_network_state_and_stop`:
# Servo writes its cookie jar only at the end of its own shutdown, which the core skips
# (`_exit`), so without it no cookie lasted past a run.
[patch.crates-io]
servo-url = { path = "../patches/servo-url" }
servo = { path = "../patches/servo" }
# servo-script 0.6.0 with a module that awaits at its top level no longer reported as an
# "uncaught exception: undefined" (`modules/script_module.rs`, marked `Lepton:`).
servo-script = { path = "../patches/servo-script" }
# servo-net-traits 0.6.0: a blob URL made by the app's page has the page's origin even
# when the load did not claim it (`blob_url_store.rs`, marked `Lepton:`). Babylon loads a
# GLB's textures as `blob:` images; Servo refused every one ("Unsupported scheme").
servo-net-traits = { path = "../patches/servo-net-traits" }

[lints.rust]
# Denied, not forbidden: the C boundary (`src/abi.rs`) is the one module allowed it,
# and every block there says what it relies on.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
