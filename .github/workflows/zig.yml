# The core with each Zig Lepton builds with: 0.16 and 0.17 (`crates/orchestrator/src/zig.rs`).
# The differences between them live in `zig/src/compat.zig`, `zig_017` in
# `zig/src/build_support.zig`, and the C headers under `zig/src/c/` that the build
# translates; this keeps both honest.
name: zig

on:
  push:
    branches: [trunk]
    paths: ["zig/**", "packages/*/zig/**", "crates/template_injector/assets/*.zig", "crates/cli/**", ".github/workflows/zig.yml"]
  pull_request:
    paths: ["zig/**", "packages/*/zig/**", "crates/template_injector/assets/*.zig", "crates/cli/**", ".github/workflows/zig.yml"]
  workflow_dispatch:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.16.0", "0.17.0"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxcb1-dev \
            libxcb-randr0-dev libxcb-image0-dev libcairo2-dev \
            libegl-dev libgles-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev libxkbcommon-dev \
            libegl-mesa0 libgl1-mesa-dri fonts-noto-core

      - name: Zig ${{ matrix.zig }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/${{ matrix.zig }}/zig-x86_64-linux-${{ matrix.zig }}.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig" && tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      # 0.16's formatting is the repository's: 0.17's `zig fmt` rewrites builtins 0.16
      # does not have (`@intFromEnum` to `@backingInt`, measured), so it must not be run.
      - name: Formatting
        if: matrix.zig == '0.16.0'
        run: zig fmt --check zig/src zig/build.zig packages/*/zig

      - name: Core tests
        working-directory: zig
        run: |
          zig version
          zig build test --summary all

      # The native render path's own tests (presenter, GLES 3 renderer, window layers):
      # with EGL's headers above, the GPU presenter is compiled too (`have_egl`); without
      # them it was compiled out and a change to it reached no compiler here.
      # The GPU tests draw off screen and read the pixels back: with no display here,
      # Mesa's surfaceless platform gives EGL a device (llvmpipe), so they run, not skip.
      - name: Native core tests
        working-directory: zig
        env:
          EGL_PLATFORM: surfaceless
        run: zig build test -Drender=native --summary all

      - name: Plugin tests
        run: |
          zig test packages/plugin-fs/zig/fs.zig -lc -fllvm -flld
          zig test packages/plugin-os/zig/os.zig -lc -fllvm -flld
          zig test packages/plugin-dialog/zig/request.zig -fllvm -flld

      - name: Cookie shim
        run: node --test zig/src/render/webview/cookie_shim.test.mjs

      # The template's own `main.zig` is compiled only in a project; the core tests above
      # never reach it. A native app from this tree's CLI, built (the runner has no display
      # to open it on), with this matrix's Zig.
      - name: Native template app
        run: |
          cargo build --release --bin lepton
          export LEPTON_ZIG="$(command -v zig)"
          ./target/release/lepton new ci-native --template vanilla-ts --target native --non-interactive
          cd ci-native
          ../target/release/lepton build --native
