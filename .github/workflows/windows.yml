# A template app on Windows Server 2025 (build 26100, the base Windows 11 24H2 shares):
# built by the CLI from this checkout, opened on the runner's desktop and measured from
# outside — the title bar's DWM attributes as the page changes its theme-color (Windows
# 11's caption colour, which a Windows 10 machine cannot show), placement, icons, the
# single instance, the native menu and the page's own bar with real mouse and keys —
# then packaged as zip and msi, installed, run and removed, and built again with
# "decorations": false (frameless: drag, double click, the resize border).
# The same app is also packaged on Linux (`lepton package --windows`, job linux-package):
# that MSI is installed, run, measured and removed here too, and both machines' zip and
# msi are compared byte for byte.
# The scripts are tools/ci/windows/; their report and screenshots are the artifact.
name: windows

on:
  push:
    branches: [trunk]
    paths:
      - "zig/**"
      - "crates/**"
      - "packages/api/**"
      - "tools/ci/windows/**"
      - "tools/d3d11-shaders.mjs"
      - "tools/vulkan-shaders.mjs"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  # The Windows package made on Linux: the CLI cross-builds the core with Zig and writes
  # the zip and the msi in Rust (installer_db.rs), so Linux needs neither Windows nor WiX.
  linux-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Zig 0.16
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig" && tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: CLI
        run: |
          cargo build --release --bin lepton
          ./target/release/lepton --version

      # The app the Windows job builds, made the same way (same name, owner, config, page).
      - name: Package for Windows
        run: |
          npm install -g pnpm@10
          pnpm --dir packages/api install --frozen-lockfile
          pnpm --dir packages/api run build
          lepton="$GITHUB_WORKSPACE/target/release/lepton"
          cd "$RUNNER_TEMP"
          "$lepton" new ci-app --template vanilla-ts --target webview --package-manager npm --owner ci --non-interactive
          cd ci-app
          node -e '
            const fs = require("fs");
            const ws = process.env.GITHUB_WORKSPACE;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const group of ["dependencies", "devDependencies"]) {
              if (pkg[group]?.["@lepton-desk/api"]) pkg[group]["@lepton-desk/api"] = `file:${ws}/packages/api`;
              if (pkg[group]?.["@lepton-desk/cli"]) pkg[group]["@lepton-desk/cli"] = `file:${ws}/packages/cli`;
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            const config = JSON.parse(fs.readFileSync("lepton.config.json", "utf8"));
            config.deepLinks = ["leptonci"];
            config.bundle = { targets: ["zip", "msi"] };
            config.permissions = [...config.permissions, "window.start_drag", "window.menu", "window.maximize", "window.unmaximize", "window.state", "window.minimize", "window.close"];
            fs.writeFileSync("lepton.config.json", JSON.stringify(config, null, 2));
          '
          cp "$GITHUB_WORKSPACE/tools/ci/ci-page.ts" src/
          echo 'import "./ci-page.ts";' >> src/main.ts
          npm install --no-audit --no-fund
          "$lepton" package --windows
          mkdir -p "$RUNNER_TEMP/out"
          cp src-lepton/bundle/*.msi src-lepton/bundle/*.zip "$RUNNER_TEMP/out/"
          sha256sum "$RUNNER_TEMP"/out/* | tee "$RUNNER_TEMP/out/sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package-from-linux
          path: ${{ runner.temp }}/out

  app:
    needs: linux-package
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Zig 0.16
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\zig-x86_64-windows-0.16.0"

      # The DXBC in the repository is what its HLSL compiles to (docs/plans/windows.md):
      # this runner has the Windows SDK's fxc.
      - name: Shaders match their source
        run: node tools/d3d11-shaders.mjs --check

      # The Vulkan backend's SPIR-V, compiled again with the glslang release it was made
      # with (16.6.0: another version may emit other bytes), checked against its digest.
      - name: Vulkan shaders match their source
        run: |
          $zip = "$env:RUNNER_TEMP\glslang.zip"
          Invoke-WebRequest -Uri https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip -OutFile $zip
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($digest -ne "82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b") { throw "glslang digest $digest" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\glslang"
          $env:GLSLANG = "$env:RUNNER_TEMP\glslang\bin\glslang.exe"
          node tools/vulkan-shaders.mjs --check

      # The native path's GPU half: a Direct3D 11 device and swap chain on the native window,
      # the draw command list read back from the screen. The runner has no GPU of its own;
      # what it does have is measured, not assumed.
      - name: GPU backends (Direct3D 11, OpenGL 3.3, Vulkan)
        if: ${{ !cancelled() }}
        working-directory: zig
        run: |
          zig build win32-window-check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          zig build windows-gpu-check

      - name: CLI
        run: |
          cargo build --release --bin lepton
          ./target/release/lepton.exe --version

      # The SDK from this checkout: the CLI's own version may not be on npm yet. Built
      # with its own manager (pnpm, its lockfile), so its dist/ is current.
      - name: Template app
        run: |
          npm install -g pnpm@10
          pnpm --dir packages/api install --frozen-lockfile
          pnpm --dir packages/api run build
          $lepton = "$env:GITHUB_WORKSPACE\target\release\lepton.exe"
          Set-Location $env:RUNNER_TEMP
          & $lepton new ci-app --template vanilla-ts --target webview --package-manager npm --owner ci --non-interactive
          Set-Location ci-app
          $api = ($env:GITHUB_WORKSPACE -replace '\\', '/') + "/packages/api"
          $cli = ($env:GITHUB_WORKSPACE -replace '\\', '/') + "/packages/cli"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          foreach ($group in "dependencies", "devDependencies") {
            if ($pkg.$group.'@lepton-desk/api') { $pkg.$group.'@lepton-desk/api' = "file:$api" }
            if ($pkg.$group.'@lepton-desk/cli') { $pkg.$group.'@lepton-desk/cli' = "file:$cli" }
          }
          $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8NoBOM
          $config = Get-Content lepton.config.json -Raw | ConvertFrom-Json
          $config | Add-Member -NotePropertyName deepLinks -NotePropertyValue @("leptonci") -Force
          $config | Add-Member -NotePropertyName bundle -NotePropertyValue ([pscustomobject]@{ targets = @("zip", "msi") }) -Force
          # ci-page.ts moves the window from its own bar and opens the system's menu.
          $config.permissions = @($config.permissions) + @("window.start_drag", "window.menu", "window.maximize", "window.unmaximize", "window.state", "window.minimize", "window.close")
          $config | ConvertTo-Json -Depth 20 | Set-Content lepton.config.json -Encoding utf8NoBOM
          # What measure.ps1 drives: the theme by deep link, the page's bar, the menu.
          Copy-Item "$env:GITHUB_WORKSPACE\tools\ci\ci-page.ts" src/
          Add-Content -Path src/main.ts -Value 'import "./ci-page.ts";'
          npm install --no-audit --no-fund
          & $lepton build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem src-lepton/zig-out/bin
          # The PE header keeps Zig's 6.0: with a 10.0 subsystem version the program ran with
          # no window and no WebView2 process here, while the same bytes with 6.0 opened
          # (measured, 2026-10-25). Windows 10 is checked when the program starts instead.
          $exe = (Get-ChildItem src-lepton\zig-out\bin\*.exe | Select-Object -First 1).FullName
          $bytes = [IO.File]::ReadAllBytes($exe)
          $optional = [BitConverter]::ToInt32($bytes, 0x3c) + 24
          $os = "$([BitConverter]::ToUInt16($bytes, $optional + 40)).$([BitConverter]::ToUInt16($bytes, $optional + 42))"
          $subsystem = "$([BitConverter]::ToUInt16($bytes, $optional + 48)).$([BitConverter]::ToUInt16($bytes, $optional + 50))"
          "PE header: operating system $os, subsystem $subsystem"
          if ($os -ne "6.0" -or $subsystem -ne "6.0") { exit 1 }

      - name: Window
        run: |
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\ci-app\src-lepton\zig-out\bin\*.exe" | Select-Object -First 1).FullName
          ./tools/ci/windows/measure.ps1 -Exe $exe -Out "$env:RUNNER_TEMP\report\window"

      # Each check runs even when one before it failed; the job still fails.
      - name: Package, install, remove
        if: ${{ !cancelled() }}
        run: |
          $lepton = "$env:GITHUB_WORKSPACE\target\release\lepton.exe"
          $out = "$env:RUNNER_TEMP\report\package"
          New-Item -ItemType Directory -Force $out | Out-Null
          Set-Location "$env:RUNNER_TEMP\ci-app"
          & $lepton package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem src-lepton/bundle -File | ForEach-Object { "$($_.Name) $($_.Length) $((Get-FileHash $_.FullName).Hash)" } | Tee-Object "$out\files.txt"
          $msi = (Get-ChildItem src-lepton/bundle/*.msi | Select-Object -First 1).FullName
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$out\install.log`"" -Wait -PassThru
          "install: exit $($install.ExitCode)" | Tee-Object -Append "$out\files.txt"
          if ($install.ExitCode) { exit 1 }
          $product = (Get-Content lepton.config.json -Raw | ConvertFrom-Json).productName
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs\$product" -Recurse -Filter *.exe | Select-Object -First 1
          "installed: $($installed.FullName)" | Tee-Object -Append "$out\files.txt"
          & "$env:GITHUB_WORKSPACE\tools\ci\windows\measure.ps1" -Exe $installed.FullName -Out "$out\installed"
          $measured = $LASTEXITCODE
          $remove = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v `"$out\remove.log`"" -Wait -PassThru
          "remove: exit $($remove.ExitCode), folder left: $(Test-Path "$env:LOCALAPPDATA\Programs\$product")" | Tee-Object -Append "$out\files.txt"
          if ($remove.ExitCode -or (Test-Path "$env:LOCALAPPDATA\Programs\$product") -or $measured) { exit 1 }

      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: windows-package-from-linux
          path: ${{ runner.temp }}/linux-package

      # The MSI made on Linux, installed, run, measured and removed as the one made here;
      # then both machines' files compared. Each machine's own builds are reproducible; the
      # two machines' were not identical on 2026-10-24 (`members.txt` says where).
      - name: The Linux-made package
        if: ${{ !cancelled() }}
        run: |
          $out = "$env:RUNNER_TEMP\report\linux-package"
          New-Item -ItemType Directory -Force $out | Out-Null
          $from = "$env:RUNNER_TEMP\linux-package"
          $here = "$env:RUNNER_TEMP\ci-app\src-lepton\bundle"
          foreach ($kind in "zip", "msi") {
            $linux = Get-ChildItem "$from\*.$kind" | Select-Object -First 1
            $windows = Get-ChildItem "$here\*.$kind" | Select-Object -First 1
            $a = (Get-FileHash $linux.FullName).Hash
            $b = (Get-FileHash $windows.FullName).Hash
            "$kind  linux $($linux.Length) $a  windows $($windows.Length) $b  identical: $($a -eq $b)" | Tee-Object -Append "$out\compare.txt"
          }
          # Which files differ: the two .zip files were not identical (2026-10-24), and only
          # the reports leave this machine.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $sha = [System.Security.Cryptography.SHA256]::Create()
          foreach ($side in @(@("linux", $from), @("windows", $here))) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Get-ChildItem "$($side[1])\*.zip" | Select-Object -First 1).FullName)
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.EndsWith("/")) { continue }
              $stream = $entry.Open()
              $hash = [BitConverter]::ToString($sha.ComputeHash($stream)).Replace("-", "")
              $stream.Close()
              "$($side[0])  $($entry.FullName)  $($entry.Length)  $hash" | Tee-Object -Append "$out\members.txt"
            }
            $zip.Dispose()
          }
          # The Windows-made package itself, to set its `.exe` beside the Linux-made one.
          Copy-Item "$here\*.zip" $out
          $msi = (Get-ChildItem "$from\*.msi" | Select-Object -First 1).FullName
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$out\install.log`"" -Wait -PassThru
          "install: exit $($install.ExitCode)" | Tee-Object -Append "$out\result.txt"
          if ($install.ExitCode) { exit 1 }
          $product = (Get-Content "$env:RUNNER_TEMP\ci-app\lepton.config.json" -Raw | ConvertFrom-Json).productName
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs\$product" -Recurse -Filter *.exe | Select-Object -First 1
          "installed: $($installed.FullName)" | Tee-Object -Append "$out\result.txt"
          & "$env:GITHUB_WORKSPACE\tools\ci\windows\measure.ps1" -Exe $installed.FullName -Out "$out\installed"
          $measured = $LASTEXITCODE
          $remove = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v `"$out\remove.log`"" -Wait -PassThru
          "remove: exit $($remove.ExitCode), folder left: $(Test-Path "$env:LOCALAPPDATA\Programs\$product")" | Tee-Object -Append "$out\result.txt"
          if ($remove.ExitCode -or (Test-Path "$env:LOCALAPPDATA\Programs\$product") -or $measured) { exit 1 }

      # The same app with "window": { "decorations": false }: the page's bar is the title bar.
      - name: Frameless window
        if: ${{ !cancelled() }}
        run: |
          $lepton = "$env:GITHUB_WORKSPACE\target\release\lepton.exe"
          Set-Location "$env:RUNNER_TEMP\ci-app"
          $config = Get-Content lepton.config.json -Raw | ConvertFrom-Json
          $window = if ($config.window) { $config.window } else { [pscustomobject]@{} }
          $window | Add-Member -NotePropertyName decorations -NotePropertyValue $false -Force
          $config | Add-Member -NotePropertyName window -NotePropertyValue $window -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content lepton.config.json -Encoding utf8NoBOM
          & $lepton build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = (Get-ChildItem src-lepton\zig-out\bin\*.exe | Select-Object -First 1).FullName
          & "$env:GITHUB_WORKSPACE\tools\ci\windows\measure.ps1" -Exe $exe -Out "$env:RUNNER_TEMP\report\frameless" -Frameless

      # WebAssembly in WebView2: the engine's features and what `wasm.threads` gives the page
      # (tools/ci/wasm-page.ts writes them into the window's title), with threads off, then on.
      - name: WebAssembly
        if: ${{ !cancelled() }}
        run: |
          $lepton = "$env:GITHUB_WORKSPACE\target\release\lepton.exe"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\report" | Out-Null
          Set-Location $env:RUNNER_TEMP
          & $lepton new wasm-app --template vanilla-ts --target webview --package-manager npm --owner ci --non-interactive
          Set-Location wasm-app
          $api = ($env:GITHUB_WORKSPACE -replace '\\', '/') + "/packages/api"
          $cli = ($env:GITHUB_WORKSPACE -replace '\\', '/') + "/packages/cli"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          foreach ($group in "dependencies", "devDependencies") {
            if ($pkg.$group.'@lepton-desk/api') { $pkg.$group.'@lepton-desk/api' = "file:$api" }
            if ($pkg.$group.'@lepton-desk/cli') { $pkg.$group.'@lepton-desk/cli' = "file:$cli" }
          }
          $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8NoBOM
          Copy-Item "$env:GITHUB_WORKSPACE\tools\ci\wasm-page.ts" src/main.ts -Force
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --save-exact wasm-feature-detect@1.9.0
          $failed = $false
          foreach ($threads in $false, $true) {
            $config = Get-Content lepton.config.json -Raw | ConvertFrom-Json
            $config | Add-Member -NotePropertyName wasm -NotePropertyValue ([pscustomobject]@{ threads = $threads }) -Force
            $config | ConvertTo-Json -Depth 20 | Set-Content lepton.config.json -Encoding utf8NoBOM
            & $lepton build
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $exe = (Get-ChildItem src-lepton\zig-out\bin\*.exe | Select-Object -First 1).FullName
            $process = Start-Process $exe -PassThru
            $title = ""
            for ($i = 0; $i -lt 60 -and -not $title.StartsWith("WASM"); $i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              $title = "$($process.MainWindowTitle)"
            }
            "threads $($threads.ToString().ToLower()): $title" | Tee-Object -Append -FilePath "$env:RUNNER_TEMP\report\wasm.txt"
            [void]$process.CloseMainWindow()
            if (-not $process.WaitForExit(10000)) { Stop-Process -Id $process.Id -Force }
            $isolated = $title -match "isolated=true sab=function worker=ok value=42"
            if (-not $title.StartsWith("WASM") -or ($threads -ne $isolated)) { $failed = $true }
          }
          if ($failed) { exit 1 }

      # What a Lepton app costs in memory, as Task Manager's Memory column counts it: the
      # same template as a web view app and as a native one, each packaged and run by
      # `lepton package --verify` (the tree's private working set after 3 s).
      - name: Memory
        if: ${{ !cancelled() }}
        run: |
          $lepton = "$env:GITHUB_WORKSPACE\target\release\lepton.exe"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\report" | Out-Null
          $api = ($env:GITHUB_WORKSPACE -replace '\\', '/') + "/packages/api"
          $cli = ($env:GITHUB_WORKSPACE -replace '\\', '/') + "/packages/cli"
          $failed = $false
          foreach ($target in "webview", "native") {
            Set-Location $env:RUNNER_TEMP
            & $lepton new "memory-$target" --template vanilla-ts --target $target --package-manager npm --owner ci --non-interactive
            Set-Location "memory-$target"
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            foreach ($group in "dependencies", "devDependencies") {
              if ($pkg.$group.'@lepton-desk/api') { $pkg.$group.'@lepton-desk/api' = "file:$api" }
              if ($pkg.$group.'@lepton-desk/cli') { $pkg.$group.'@lepton-desk/cli' = "file:$cli" }
            }
            $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8NoBOM
            npm install --no-audit --no-fund
            # The native app once more on the CPU: whether the GPU is what it costs or keeps.
            $runs = if ($target -eq "native") { @("", "cpu") } else { @("") }
            foreach ($gpu in $runs) {
              $env:LEPTON_GPU = $gpu
              if ($gpu) { $output = & $lepton package --no-build --verify } else { $output = & $lepton package --verify }
              $code = $LASTEXITCODE
              $output
              $line = $output | Select-String "ok: up"
              if ($code -or -not $line) { $failed = $true }
              $name = if ($gpu) { "$target (LEPTON_GPU=$gpu)" } else { $target }
              "${name}: $line" | Tee-Object -Append -FilePath "$env:RUNNER_TEMP\report\memory.txt"
            }
            Remove-Item Env:LEPTON_GPU -ErrorAction SilentlyContinue
          }
          if ($failed) { exit 1 }

      # Who opens the untitled MicrosoftWindowsTooltip window the native app's process
      # owns (40392615483: listed before its LeptonWindow, visible; Lepton's code creates
      # no tooltip). Each program is started and its top-level windows are polled every
      # 100 ms for 6 s: when each first appeared and when it went, on which thread, owned
      # by what, and which loaded module created it (GWLP_HINSTANCE) and registered its
      # class (GCLP_HMODULE).
      # Then the modules the process has loaded, then WM_CLOSE to its LeptonWindow. The native app
      # on the GPU and on the CPU, and the web view app beside them.
      - name: Native windows
        if: ${{ !cancelled() }}
        run: |
          $out = "$env:RUNNER_TEMP\report\windows.txt"
          Add-Type -TypeDefinition @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class Wins {
            delegate bool EnumProc(IntPtr window, IntPtr data);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc proc, IntPtr data);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr window, out uint pid);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr window, StringBuilder text, int size);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetClassName(IntPtr window, StringBuilder text, int size);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr window);
            [DllImport("user32.dll")] static extern IntPtr GetWindow(IntPtr window, uint command);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr window, uint message, IntPtr wparam, IntPtr lparam);
            [DllImport("user32.dll", EntryPoint = "GetWindowLongPtrW")] static extern IntPtr GetWindowLongPtr(IntPtr window, int index);
            [DllImport("user32.dll", EntryPoint = "GetClassLongPtrW")] static extern IntPtr GetClassLongPtr(IntPtr window, int index);
            public static IntPtr Instance(IntPtr window) { return GetWindowLongPtr(window, -6); }
            public static IntPtr ClassModule(IntPtr window) { return GetClassLongPtr(window, -16); }
            public static List<IntPtr> Of(uint id) {
              var found = new List<IntPtr>();
              EnumWindows((window, data) => { uint pid; GetWindowThreadProcessId(window, out pid); if (pid == id) found.Add(window); return true; }, IntPtr.Zero);
              return found;
            }
            public static string ClassOf(IntPtr window) { var name = new StringBuilder(256); GetClassName(window, name, 256); return name.ToString(); }
            public static string Describe(IntPtr window) {
              var title = new StringBuilder(256);
              GetWindowText(window, title, 256);
              uint pid;
              uint thread = GetWindowThreadProcessId(window, out pid);
              IntPtr owner = GetWindow(window, 4);
              string ownedBy = owner == IntPtr.Zero ? "none" : ClassOf(owner);
              return "class '" + ClassOf(window) + "' title '" + title + "' visible " + IsWindowVisible(window) + " thread " + thread + " owner " + ownedBy;
            }
          }
          "@
          $programs = @(
            @{ name = "native"; exe = "memory-native"; gpu = "" },
            @{ name = "native (LEPTON_GPU=cpu)"; exe = "memory-native"; gpu = "cpu" },
            @{ name = "webview"; exe = "memory-webview"; gpu = "" }
          )
          foreach ($program in $programs) {
            $name = $program.name
            $exe = (Get-ChildItem "$env:RUNNER_TEMP\$($program.exe)\src-lepton\bundle\*\bin\*.exe" | Select-Object -First 1).FullName
            $env:LEPTON_GPU = $program.gpu
            $started = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process $exe -PassThru -RedirectStandardError "$env:RUNNER_TEMP\windows-$($program.exe)-$($program.gpu).log"
            Remove-Item Env:LEPTON_GPU -ErrorAction SilentlyContinue
            # Read the moment a window is first seen: the tooltip was gone by 6 s in
            # 40398520075, and read afterwards it gave no class and no modules.
            $seen = @{}
            while ($started.ElapsedMilliseconds -lt 6000) {
              $now = [Wins]::Of([uint32]$process.Id)
              foreach ($window in $now) {
                if (-not $seen.ContainsKey($window)) {
                  $seen[$window] = "here"
                  $at = $started.ElapsedMilliseconds
                  $instance = [int64][Wins]::Instance($window)
                  $classModule = [int64][Wins]::ClassModule($window)
                  $process.Refresh()
                  $byBase = @{}
                  foreach ($module in $process.Modules) { $byBase[[int64]$module.BaseAddress] = $module.FileName }
                  $made = if ($byBase.ContainsKey($instance)) { $byBase[$instance] } else { "0x{0:x} (not a loaded module)" -f $instance }
                  $registered = if ($byBase.ContainsKey($classModule)) { $byBase[$classModule] } else { "0x{0:x} (not a loaded module)" -f $classModule }
                  "${name}: at $at ms window $window $([Wins]::Describe($window)), created by $made, class registered by $registered" | Tee-Object -Append -FilePath $out
                }
              }
              foreach ($window in @($seen.Keys)) {
                if ($seen[$window] -eq "here" -and -not $now.Contains($window)) {
                  $seen[$window] = "gone"
                  "${name}: at $($started.ElapsedMilliseconds) ms window $window gone" | Tee-Object -Append -FilePath $out
                }
              }
              Start-Sleep -Milliseconds 100
            }
            $process.Refresh()
            "${name}: modules $(($process.Modules | ForEach-Object { $_.ModuleName }) -join ' ')" | Tee-Object -Append -FilePath $out
            $lepton = [Wins]::Of([uint32]$process.Id) | Where-Object { [Wins]::ClassOf($_) -eq "LeptonWindow" } | Select-Object -First 1
            if ($lepton) { [void][Wins]::PostMessage($lepton, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) }
            "${name}: ended within 5 s of WM_CLOSE $($process.WaitForExit(5000))" | Tee-Object -Append -FilePath $out
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Start-Sleep -Seconds 1
          }

      # Which module carries the tooltip window's class name: Windows reports the class
      # registered under the program's own module handle and the window created with no
      # instance (40401878582), and Lepton's program does not contain the name. Every
      # module the native app has loaded after 3 s is searched for it, as ASCII and UTF-16.
      - name: Tooltip class name
        if: ${{ !cancelled() }}
        run: |
          $out = "$env:RUNNER_TEMP\report\tooltip.txt"
          Add-Type -TypeDefinition @"
          using System;
          using System.Text;
          public static class Bytes {
            public static int Count(byte[] data, byte[] what) {
              int found = 0;
              for (int i = 0; i + what.Length <= data.Length; i++) {
                int j = 0;
                while (j < what.Length && data[i + j] == what[j]) j++;
                if (j == what.Length) { found++; i += what.Length - 1; }
              }
              return found;
            }
          }
          "@
          $name = "MicrosoftWindowsTooltip"
          $ascii = [Text.Encoding]::ASCII.GetBytes($name)
          $wide = [Text.Encoding]::Unicode.GetBytes($name)
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\memory-native\src-lepton\bundle\*\bin\*.exe" | Select-Object -First 1).FullName
          $process = Start-Process $exe -PassThru
          Start-Sleep -Seconds 3
          $process.Refresh()
          $files = $process.Modules | ForEach-Object { $_.FileName }
          Stop-Process -Id $process.Id -Force
          "modules: $($files.Count)" | Tee-Object -Append -FilePath $out
          foreach ($file in $files) {
            $data = [IO.File]::ReadAllBytes($file)
            $a = [Bytes]::Count($data, $ascii)
            $w = [Bytes]::Count($data, $wide)
            if ($a -or $w) { "$file  ascii $a  utf16 $w" | Tee-Object -Append -FilePath $out }
          }
          "searched" | Tee-Object -Append -FilePath $out

      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-2025
          path: ${{ runner.temp }}/report
          if-no-files-found: warn
