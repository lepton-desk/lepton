# A template app on Windows Server 2025 (build 26100, the base Windows 11 24H2 shares):
# built by the CLI from this checkout, opened on the runner's desktop and measured from
# outside — the title bar's DWM attributes as the page changes its theme-color (Windows
# 11's caption colour, which a Windows 10 machine cannot show), placement, icons, the
# single instance, the native menu and the page's own bar with real mouse and keys —
# then packaged as zip and msi, installed, run and removed, and built again with
# "decorations": false (frameless: drag, double click, the resize border).
# The same app is also packaged on Linux (`lepton package --windows`, job linux-package):
# that MSI is installed, run, measured and removed here too, and both machines' zip and
# msi are compared byte for byte.
# The scripts are tools/ci/windows/; their report and screenshots are the artifact.
name: windows

on:
  push:
    branches: [trunk]
    paths:
      - "zig/**"
      - "crates/**"
      - "packages/api/**"
      - "tools/ci/windows/**"
      - "tools/d3d11-shaders.mjs"
      - "tools/vulkan-shaders.mjs"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  # The Windows package made on Linux: the CLI cross-builds the core with Zig and writes
  # the zip and the msi in Rust (installer_db.rs), so Linux needs neither Windows nor WiX.
  linux-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Zig 0.16
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig" && tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: CLI
        run: |
          cargo build --release --bin lepton
          ./target/release/lepton --version

      # The app the Windows job builds, made the same way (same name, owner, config, page).
      - name: Package for Windows
        run: |
          npm install -g pnpm@10
          pnpm --dir packages/api install --frozen-lockfile
          pnpm --dir packages/api run build
          lepton="$GITHUB_WORKSPACE/target/release/lepton"
          cd "$RUNNER_TEMP"
          "$lepton" new ci-app --template vanilla-ts --target webview --package-manager npm --owner ci --non-interactive
          cd ci-app
          node -e '
            const fs = require("fs");
            const ws = process.env.GITHUB_WORKSPACE;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const group of ["dependencies", "devDependencies"]) {
              if (pkg[group]?.["@lepton-desk/api"]) pkg[group]["@lepton-desk/api"] = `file:${ws}/packages/api`;
              if (pkg[group]?.["@lepton-desk/cli"]) pkg[group]["@lepton-desk/cli"] = `file:${ws}/packages/cli`;
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            const config = JSON.parse(fs.readFileSync("lepton.config.json", "utf8"));
            config.deepLinks = ["leptonci"];
            config.bundle = { targets: ["zip", "msi"] };
            config.permissions = [...config.permissions, "window.start_drag", "window.menu", "window.maximize", "window.unmaximize", "window.state", "window.minimize", "window.close"];
            fs.writeFileSync("lepton.config.json", JSON.stringify(config, null, 2));
          '
          cp "$GITHUB_WORKSPACE/tools/ci/ci-page.ts" src/
          echo 'import "./ci-page.ts";' >> src/main.ts
          npm install --no-audit --no-fund
          "$lepton" package --windows
          mkdir -p "$RUNNER_TEMP/out"
          cp src-lepton/bundle/*.msi src-lepton/bundle/*.zip "$RUNNER_TEMP/out/"
          sha256sum "$RUNNER_TEMP"/out/* | tee "$RUNNER_TEMP/out/sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package-from-linux
          path: ${{ runner.temp }}/out

  app:
    needs: linux-package
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Zig 0.16
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\zig-x86_64-windows-0.16.0"

      # The DXBC in the repository is what its HLSL compiles to (docs/plans/windows.md):
      # this runner has the Windows SDK's fxc.
      - name: Shaders match their source
        run: node tools/d3d11-shaders.mjs --check

      # The Vulkan backend's SPIR-V, compiled again with the glslang release it was made
      # with (16.6.0: another version may emit other bytes), checked against its digest.
      - name: Vulkan shaders match their source
        run: |
          $zip = "$env:RUNNER_TEMP\glslang.zip"
          Invoke-WebRequest -Uri https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip -OutFile $zip
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($digest -ne "82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b") { throw "glslang digest $digest" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\glslang"
          $env:GLSLANG = "$env:RUNNER_TEMP\glslang\bin\glslang.exe"
          node tools/vulkan-shaders.mjs --check

      # The native path's GPU half: a Direct3D 11 device and swap chain on the native window,
      # the draw command list read back from the screen. The runner has no GPU of its own;
      # what it does have is measured, not assumed.
      - name: GPU backends (Direct3D 11, OpenGL 3.3, Vulkan)
        if: ${{ !cancelled() }}
        working-directory: zig
        run: |
          zig build win32-window-check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          zig build windows-gpu-check

      - name: CLI
        run: |
          cargo build --release --bin lepton
          ./target/release/lepton.exe --version

      # The SDK from this checkout: the CLI's own version may not be on npm yet. Built
      # with its own manager (pnpm, its lockfile), so its dist/ is current.
      - name: Template app
        run: |
          npm install -g pnpm@10
          pnpm --dir packages/api install --frozen-lockfile
          pnpm --dir packages/api run build
          $lepton = "$env:GITHUB_WORKSPACE\target\release\lepton.exe"
          Set-Location $env:RUNNER_TEMP
          & $lepton new ci-app --template vanilla-ts --target webview --package-manager npm --owner ci --non-interactive
          Set-Location ci-app
          $api = ($env:GITHUB_WORKSPACE -replace '\\', '/') + "/packages/api"
          $cli = ($env:GITHUB_WORKSPACE -replace '\\', '/') + "/packages/cli"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          foreach ($group in "dependencies", "devDependencies") {
            if ($pkg.$group.'@lepton-desk/api') { $pkg.$group.'@lepton-desk/api' = "file:$api" }
            if ($pkg.$group.'@lepton-desk/cli') { $pkg.$group.'@lepton-desk/cli' = "file:$cli" }
          }
          $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8NoBOM
          $config = Get-Content lepton.config.json -Raw | ConvertFrom-Json
          $config | Add-Member -NotePropertyName deepLinks -NotePropertyValue @("leptonci") -Force
          $config | Add-Member -NotePropertyName bundle -NotePropertyValue ([pscustomobject]@{ targets = @("zip", "msi") }) -Force
          # ci-page.ts moves the window from its own bar and opens the system's menu.
          $config.permissions = @($config.permissions) + @("window.start_drag", "window.menu", "window.maximize", "window.unmaximize", "window.state", "window.minimize", "window.close")
          $config | ConvertTo-Json -Depth 20 | Set-Content lepton.config.json -Encoding utf8NoBOM
          # What measure.ps1 drives: the theme by deep link, the page's bar, the menu.
          Copy-Item "$env:GITHUB_WORKSPACE\tools\ci\ci-page.ts" src/
          Add-Content -Path src/main.ts -Value 'import "./ci-page.ts";'
          npm install --no-audit --no-fund
          & $lepton build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem src-lepton/zig-out/bin

      - name: Window
        run: |
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\ci-app\src-lepton\zig-out\bin\*.exe" | Select-Object -First 1).FullName
          ./tools/ci/windows/measure.ps1 -Exe $exe -Out "$env:RUNNER_TEMP\report\window"

      # Each check runs even when one before it failed; the job still fails.
      - name: Package, install, remove
        if: ${{ !cancelled() }}
        run: |
          $lepton = "$env:GITHUB_WORKSPACE\target\release\lepton.exe"
          $out = "$env:RUNNER_TEMP\report\package"
          New-Item -ItemType Directory -Force $out | Out-Null
          Set-Location "$env:RUNNER_TEMP\ci-app"
          & $lepton package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem src-lepton/bundle -File | ForEach-Object { "$($_.Name) $($_.Length) $((Get-FileHash $_.FullName).Hash)" } | Tee-Object "$out\files.txt"
          $msi = (Get-ChildItem src-lepton/bundle/*.msi | Select-Object -First 1).FullName
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$out\install.log`"" -Wait -PassThru
          "install: exit $($install.ExitCode)" | Tee-Object -Append "$out\files.txt"
          if ($install.ExitCode) { exit 1 }
          $product = (Get-Content lepton.config.json -Raw | ConvertFrom-Json).productName
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs\$product" -Recurse -Filter *.exe | Select-Object -First 1
          "installed: $($installed.FullName)" | Tee-Object -Append "$out\files.txt"
          & "$env:GITHUB_WORKSPACE\tools\ci\windows\measure.ps1" -Exe $installed.FullName -Out "$out\installed"
          $measured = $LASTEXITCODE
          $remove = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v `"$out\remove.log`"" -Wait -PassThru
          "remove: exit $($remove.ExitCode), folder left: $(Test-Path "$env:LOCALAPPDATA\Programs\$product")" | Tee-Object -Append "$out\files.txt"
          if ($remove.ExitCode -or (Test-Path "$env:LOCALAPPDATA\Programs\$product") -or $measured) { exit 1 }

      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: windows-package-from-linux
          path: ${{ runner.temp }}/linux-package

      # The MSI made on Linux, installed, run, measured and removed as the one made here;
      # then both machines' files compared (reproducible: the same project, the same bytes).
      - name: The Linux-made package
        if: ${{ !cancelled() }}
        run: |
          $out = "$env:RUNNER_TEMP\report\linux-package"
          New-Item -ItemType Directory -Force $out | Out-Null
          $from = "$env:RUNNER_TEMP\linux-package"
          $here = "$env:RUNNER_TEMP\ci-app\src-lepton\bundle"
          foreach ($kind in "zip", "msi") {
            $linux = Get-ChildItem "$from\*.$kind" | Select-Object -First 1
            $windows = Get-ChildItem "$here\*.$kind" | Select-Object -First 1
            $a = (Get-FileHash $linux.FullName).Hash
            $b = (Get-FileHash $windows.FullName).Hash
            "$kind  linux $($linux.Length) $a  windows $($windows.Length) $b  identical: $($a -eq $b)" | Tee-Object -Append "$out\compare.txt"
          }
          $msi = (Get-ChildItem "$from\*.msi" | Select-Object -First 1).FullName
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$out\install.log`"" -Wait -PassThru
          "install: exit $($install.ExitCode)" | Tee-Object -Append "$out\result.txt"
          if ($install.ExitCode) { exit 1 }
          $product = (Get-Content "$env:RUNNER_TEMP\ci-app\lepton.config.json" -Raw | ConvertFrom-Json).productName
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs\$product" -Recurse -Filter *.exe | Select-Object -First 1
          "installed: $($installed.FullName)" | Tee-Object -Append "$out\result.txt"
          & "$env:GITHUB_WORKSPACE\tools\ci\windows\measure.ps1" -Exe $installed.FullName -Out "$out\installed"
          $measured = $LASTEXITCODE
          $remove = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v `"$out\remove.log`"" -Wait -PassThru
          "remove: exit $($remove.ExitCode), folder left: $(Test-Path "$env:LOCALAPPDATA\Programs\$product")" | Tee-Object -Append "$out\result.txt"
          if ($remove.ExitCode -or (Test-Path "$env:LOCALAPPDATA\Programs\$product") -or $measured) { exit 1 }

      # The same app with "window": { "decorations": false }: the page's bar is the title bar.
      - name: Frameless window
        if: ${{ !cancelled() }}
        run: |
          $lepton = "$env:GITHUB_WORKSPACE\target\release\lepton.exe"
          Set-Location "$env:RUNNER_TEMP\ci-app"
          $config = Get-Content lepton.config.json -Raw | ConvertFrom-Json
          $window = if ($config.window) { $config.window } else { [pscustomobject]@{} }
          $window | Add-Member -NotePropertyName decorations -NotePropertyValue $false -Force
          $config | Add-Member -NotePropertyName window -NotePropertyValue $window -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content lepton.config.json -Encoding utf8NoBOM
          & $lepton build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = (Get-ChildItem src-lepton\zig-out\bin\*.exe | Select-Object -First 1).FullName
          & "$env:GITHUB_WORKSPACE\tools\ci\windows\measure.ps1" -Exe $exe -Out "$env:RUNNER_TEMP\report\frameless" -Frameless

      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-2025
          path: ${{ runner.temp }}/report
          if-no-files-found: warn
