[package]
name = "lepton-cli"
description = "The Lepton developer CLI: scaffold, develop and build desktop applications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lepton"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
msi = { workspace = true }
cab = { workspace = true }
# The installer's compound file (`installer_db.rs` writes the database itself).
cfb = "0.14"
# The cabinet's fixed time stamp and the installer's name-based GUIDs (both crates `msi`/`cab` use).
time = { version = "0.3", default-features = false }
uuid = { version = "1", default-features = false }
inquire = "0.9"
lepton-core-vendoring = { path = "../core_vendoring" }
lepton-orchestrator = { path = "../orchestrator" }
lepton-template-injector = { path = "../template_injector" }

# `lepton package --verify` on Windows: the application's process tree as a job object.
[target.'cfg(windows)'.dependencies]
win32job = { workspace = true }

[lints]
workspace = true
