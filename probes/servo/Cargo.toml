[package]
name = "lepton-servo-probe"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Measures whether Servo can serve a Lepton page and carry its binary calls. Built in CI, never here."

# Not a member of the repository's workspace: Servo's dependency tree (about 1000
# crates) must never reach `cargo build` or `cargo test` at the root.
[workspace]

[dependencies]
# Servo's LTS line, pinned exactly: monthly releases break the embedding API.
servo = "=0.6.0"
# The request body reaches a protocol handler as a stream over IPC; reading it needs
# the types the `servo` crate does not re-export. Same versions as Servo 0.6 uses.
# Its library is named `net_traits`.
servo-net-traits = "=0.6.0"
ipc-channel = "0.22"
dpi = "0.1"
http = "1.4"
tokio = { version = "1", features = ["sync"] }
url = "2.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
